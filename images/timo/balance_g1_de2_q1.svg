<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="250" style="background:#ffffff; border-radius:12px; font-family:sans-serif;">
  <style>
    .title { font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
    .label { font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
    .sub { font-size: 11px; fill: #64748b; text-anchor: middle; }
    .beam { stroke: #475569; stroke-width: 4; stroke-linecap: round; }
    .cord { stroke: #94a3b8; stroke-width: 1.5; }
    .pan { fill: #cbd5e1; stroke: #64748b; stroke-width: 2; }
    .base { fill: #10b981; }
    .box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; }
  </style>

  <!-- CAN 1 -->
  <g transform="translate(10, 10)">
    <rect class="box" x="0" y="0" width="330" height="230" />
    <text class="title" x="165" y="25">Chiếc cân 1 (Balance 1)</text>
    
    <!-- Base -->
    <polygon points="165,110 150,175 180,175" class="base" />
    <rect x="135" y="175" width="60" height="10" rx="3" fill="#047857" />
    
    <!-- Beam: Left down (Pear heavier), Right up (Orange + Na lighter) -->
    <line class="beam" x1="65" y1="130" x2="265" y2="90" />
    <circle cx="165" cy="110" r="5" fill="#0f172a" />
    
    <!-- Left Pan (Pear) -->
    <line class="cord" x1="65" y1="130" x2="45" y2="160" />
    <line class="cord" x1="65" y1="130" x2="85" y2="160" />
    <path class="pan" d="M 40,160 Q 65,175 90,160 Z" />
    <text x="65" y="152" font-size="28" text-anchor="middle">🍐</text>
    <text class="label" x="65" y="195">Quả lê</text>
    <text class="sub" x="65" y="210">(Pear)</text>

    <!-- Right Pan (Orange + Custard Apple) -->
    <line class="cord" x1="265" y1="90" x2="235" y2="120" />
    <line class="cord" x1="265" y1="90" x2="295" y2="120" />
    <path class="pan" d="M 230,120 Q 265,135 300,120 Z" />
    <text x="252" y="112" font-size="22" text-anchor="middle">🍊</text>
    <text x="278" y="112" font-size="22" text-anchor="middle">🍈</text>
    <text class="label" x="265" y="155">Cam + Na</text>
    <text class="sub" x="265" y="170">(Orange + Custard Apple)</text>
  </g>

  <!-- CAN 2 -->
  <g transform="translate(360, 10)">
    <rect class="box" x="0" y="0" width="330" height="230" />
    <text class="title" x="165" y="25">Chiếc cân 2 (Balance 2)</text>
    
    <!-- Base -->
    <polygon points="165,110 150,175 180,175" class="base" />
    <rect x="135" y="175" width="60" height="10" rx="3" fill="#047857" />
    
    <!-- Beam: Left down (Orange heavier), Right up (Na + Apple) -->
    <line class="beam" x1="65" y1="130" x2="265" y2="90" />
    <circle cx="165" cy="110" r="5" fill="#0f172a" />
    
    <!-- Left Pan (Orange) -->
    <line class="cord" x1="65" y1="130" x2="45" y2="160" />
    <line class="cord" x1="65" y1="130" x2="85" y2="160" />
    <path class="pan" d="M 40,160 Q 65,175 90,160 Z" />
    <text x="65" y="152" font-size="26" text-anchor="middle">🍊</text>
    <text class="label" x="65" y="195">Quả cam</text>
    <text class="sub" x="65" y="210">(Orange)</text>

    <!-- Right Pan (Na + Apple) -->
    <line class="cord" x1="265" y1="90" x2="235" y2="120" />
    <line class="cord" x1="265" y1="90" x2="295" y2="120" />
    <path class="pan" d="M 230,120 Q 265,135 300,120 Z" />
    <text x="252" y="112" font-size="22" text-anchor="middle">🍈</text>
    <text x="278" y="112" font-size="22" text-anchor="middle">🍎</text>
    <text class="label" x="265" y="155">Na + Táo</text>
    <text class="sub" x="265" y="170">(Custard Apple + Apple)</text>
  </g>
</svg>