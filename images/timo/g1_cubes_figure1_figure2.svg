<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="280" style="background:#ffffff; border-radius:12px; font-family:sans-serif;">
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .tag { font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>

  <!-- PANEL FIGURE 1 -->
  <g transform="translate(20, 15)">
    <rect class="box" x="0" y="0" width="280" height="250" />
    <text class="title" x="140" y="30">Hình 1 (Figure 1)</text>
    <text class="subtitle" x="140" y="52">1 khối gồm 5 hình lập phương</text>
    
    <!-- 5 cubes in cross/plus shape -->
    <!-- Center cube at (140, 140), size 26 -->
    <!-- Center: (140, 140) -->
    <!-- Left: (140 - 22.5, 140 - 13) -->
    <!-- Right: (140 + 22.5, 140 + 13) -->
    <!-- Top-back: (140 - 22.5, 140 + 13) -->
    <!-- Bottom-front: (140 + 22.5, 140 - 13) -->
    
    <!-- We can render clear 2D/3D flat projection: 5 cubes (Cross shape) -->
    <g transform="translate(140, 135)">
      <!-- Back / Top Cube -->
      <g transform="translate(0, -45)">
        <polygon points="0,-15 22,-2 0,11 -22,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="-22,-2 0,11 0,35 -22,22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="0,11 22,-2 22,22 0,35" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>
      <!-- Left Cube -->
      <g transform="translate(-40, -5)">
        <polygon points="0,-15 22,-2 0,11 -22,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="-22,-2 0,11 0,35 -22,22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="0,11 22,-2 22,22 0,35" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>
      <!-- Center Cube -->
      <g transform="translate(0, -5)">
        <polygon points="0,-15 22,-2 0,11 -22,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="-22,-2 0,11 0,35 -22,22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="0,11 22,-2 22,22 0,35" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>
      <!-- Right Cube -->
      <g transform="translate(40, -5)">
        <polygon points="0,-15 22,-2 0,11 -22,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="-22,-2 0,11 0,35 -22,22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="0,11 22,-2 22,22 0,35" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>
      <!-- Bottom Cube -->
      <g transform="translate(0, 35)">
        <polygon points="0,-15 22,-2 0,11 -22,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="-22,-2 0,11 0,35 -22,22" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
        <polygon points="0,11 22,-2 22,22 0,35" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>
    </g>

    <rect x="75" y="210" width="130" height="26" rx="13" fill="#2563eb" />
    <text class="tag" x="140" y="227">Gồm 5 khối</text>
  </g>

  <!-- PANEL FIGURE 2 -->
  <g transform="translate(320, 15)">
    <rect class="box" x="0" y="0" width="380" height="250" />
    <text class="title" x="190" y="30">Hình 2 (Figure 2)</text>
    <text class="subtitle" x="190" y="52">Được ghép bởi 4 khối giống Hình 1</text>

    <!-- 4 identical shapes placed in 4 quadrants -->
    <g transform="translate(190, 135) scale(0.8)">
      <!-- Top Block (Blue) -->
      <g transform="translate(0, -65)">
        <g transform="translate(0, -35)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/></g>
        <g transform="translate(-32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/></g>
        <g transform="translate(0, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/></g>
        <g transform="translate(32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/></g>
        <g transform="translate(0, 29)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.2"/></g>
      </g>
      
      <!-- Left Block (Green) -->
      <g transform="translate(-75, 10)">
        <g transform="translate(0, -35)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#a7f3d0" stroke="#065f46" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#10b981" stroke="#065f46" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#047857" stroke="#065f46" stroke-width="1.2"/></g>
        <g transform="translate(-32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#a7f3d0" stroke="#065f46" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#10b981" stroke="#065f46" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#047857" stroke="#065f46" stroke-width="1.2"/></g>
        <g transform="translate(0, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#a7f3d0" stroke="#065f46" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#10b981" stroke="#065f46" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#047857" stroke="#065f46" stroke-width="1.2"/></g>
        <g transform="translate(32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#a7f3d0" stroke="#065f46" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#10b981" stroke="#065f46" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#047857" stroke="#065f46" stroke-width="1.2"/></g>
        <g transform="translate(0, 29)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#a7f3d0" stroke="#065f46" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#10b981" stroke="#065f46" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#047857" stroke="#065f46" stroke-width="1.2"/></g>
      </g>

      <!-- Right Block (Orange) -->
      <g transform="translate(75, 10)">
        <g transform="translate(0, -35)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#f97316" stroke="#9a3412" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#c2410c" stroke="#9a3412" stroke-width="1.2"/></g>
        <g transform="translate(-32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#f97316" stroke="#9a3412" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#c2410c" stroke="#9a3412" stroke-width="1.2"/></g>
        <g transform="translate(0, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#f97316" stroke="#9a3412" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#c2410c" stroke="#9a3412" stroke-width="1.2"/></g>
        <g transform="translate(32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#f97316" stroke="#9a3412" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#c2410c" stroke="#9a3412" stroke-width="1.2"/></g>
        <g transform="translate(0, 29)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#fed7aa" stroke="#9a3412" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#f97316" stroke="#9a3412" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#c2410c" stroke="#9a3412" stroke-width="1.2"/></g>
      </g>

      <!-- Bottom Block (Purple) -->
      <g transform="translate(0, 75)">
        <g transform="translate(0, -35)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#6d28d9" stroke="#5b21b6" stroke-width="1.2"/></g>
        <g transform="translate(-32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#6d28d9" stroke="#5b21b6" stroke-width="1.2"/></g>
        <g transform="translate(0, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#6d28d9" stroke="#5b21b6" stroke-width="1.2"/></g>
        <g transform="translate(32, -3)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#6d28d9" stroke="#5b21b6" stroke-width="1.2"/></g>
        <g transform="translate(0, 29)"><polygon points="0,-12 18,-2 0,9 -18,-2" fill="#ddd6fe" stroke="#5b21b6" stroke-width="1.2"/><polygon points="-18,-2 0,9 0,28 -18,18" fill="#8b5cf6" stroke="#5b21b6" stroke-width="1.2"/><polygon points="0,9 18,-2 18,18 0,28" fill="#6d28d9" stroke="#5b21b6" stroke-width="1.2"/></g>
      </g>
    </g>

    <rect x="110" y="210" width="160" height="26" rx="13" fill="#059669" />
    <text class="tag" x="190" y="227">4 khối × 5 = 20 khối</text>
  </g>
</svg>